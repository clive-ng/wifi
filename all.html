<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibit: Control & Proximity</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; color: #333; }
        .card { background: #ffffff; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin: 20px auto; max-width: 500px; }
        h2 { color: #2c3e50; }
        .ctrl-btn { border: none; padding: 15px 30px; margin: 10px; border-radius: 50px; font-size: 1.1rem; cursor: pointer; color: white; transition: 0.2s; }
        .ctrl-btn:active { transform: scale(0.95); }
        .btn-off { background-color: #e74c3c; }
        .btn-on { background-color: #2ecc71; }
        .btn-blink { background-color: #f39c12; }
        
        #scanBtn { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #2c3e50; color: white; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.3s; width: 100%; }
        #scanBtn:hover { background-color: #34495e; } 
        .distance-display { font-size: 20px; margin: 20px 0; font-weight: bold; }

        .option { display: none; padding: 30px 20px; border-radius: 12px; margin-top: 20px; font-size: 24px; color: white; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: opacity 0.5s; }
        .active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #state1 { background: #7f8c8d; } #state2 { background: #3498db; } #state3 { background: #2ecc71; } #state4 { background: #e67e22; } #state5 { background: #e74c3c; } 
    </style>
</head>
<body>

    <h1>Interactive Museum Exhibit</h1>

    <div class="card">
        <h2>Lighting Control</h2>
        <p>Tap a button to change the ESP32 sequence via WebSockets.</p>
        <button class="ctrl-btn btn-off" onclick="sendSequence('0')">Turn OFF</button>
        <button class="ctrl-btn btn-on" onclick="sendSequence('1')">Turn ON</button><br>
        <button class="ctrl-btn btn-blink" onclick="sendSequence('2')">Slow Pulse</button>
        <button class="ctrl-btn btn-blink" onclick="sendSequence('3')">Fast Strobe</button>
        <p id="ws-status" style="font-size: 0.8rem; color: gray; margin-top:15px;">Connecting to WebSocket...</p>
    </div>

    <div class="card">
        <h2>Proximity Scanner</h2>
        <button id="scanBtn">Scan for Museum Device</button>
        <div class="distance-display">Estimated Distance: <span id="distanceLabel">--</span> meters</div>

        <div id="state1" class="option active">1. No devices nearby...</div>
        <div id="state2" class="option">2. Signal detected!</div>
        <div id="state3" class="option">3. Getting closer...</div>
        <div id="state4" class="option">4. Very close!</div>
        <div id="state5" class="option">5. Right next to the device!</div>
    </div>

    <script>
        // --- WEBSOCKET LOGIC ---
        // Change "exhibit.local" to the ESP32's IP address (e.g., "192.168.1.50") if mDNS fails on some Androids/Windows PCs.
        var gateway = "ws://exhibit.local/ws";
        var websocket;
        
        window.onload = function() {
            websocket = new WebSocket(gateway);
            websocket.onopen = function() { document.getElementById('ws-status').innerText = "✅ Connected to ESP32 Hardware!"; };
            websocket.onclose = function() { document.getElementById('ws-status').innerText = "❌ Disconnected from ESP32."; };
        };

        function sendSequence(mode) {
            if(websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(mode);
            } else {
                alert("WebSocket not connected! Make sure the ESP32 is powered on and connected to WiFi.");
            }
        }

        // --- WEB BLUETOOTH LOGIC ---
        const scanBtn = document.getElementById('scanBtn');
        const distanceLabel = document.getElementById('distanceLabel');
        const states = [
            document.getElementById('state1'), document.getElementById('state2'),
            document.getElementById('state3'), document.getElementById('state4'),
            document.getElementById('state5')
        ];

        let activeDevice = null;
        let watchController = new AbortController();
        let lastSignalTime = Date.now();
        let smoothedRssi = null;
        const alpha = 0.7; 

        scanBtn.addEventListener('click', async () => {
            try {
                if (!navigator.bluetooth) {
                    alert("Web Bluetooth is not supported. Make sure you are using an HTTPS connection or localhost!");
                    return;
                }

                scanBtn.innerText = "Checking Browser Popup...";
                
                // FILTER UPDATE: Now it only looks for devices exactly named "Exhibit_ESP32"
                activeDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { name: 'Exhibit_ESP32' }
                    ], 
                    optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
                });

                scanBtn.innerText = `Connected to BLE: ${activeDevice.name}`;

                activeDevice.addEventListener('advertisementreceived', (event) => {
                    lastSignalTime = Date.now(); 
                    let currentRssi = event.rssi;
                    if (smoothedRssi === null) { smoothedRssi = currentRssi; } 
                    else { smoothedRssi = (alpha * currentRssi) + ((1 - alpha) * smoothedRssi); }
                    
                    let txPower = -59; 
                    let ratio = (txPower - smoothedRssi) / (10 * 2.0);
                    let distance = Math.pow(10, ratio).toFixed(2);
                    
                    distanceLabel.innerText = distance;
                    updateUI(distance);
                });

                startScanning();
            } catch (error) {
                console.error('Bluetooth Error: ', error);
                scanBtn.innerText = "Scan for Museum Device";
            }
        });

        async function startScanning() {
            if (!activeDevice) return;
            try {
                watchController.abort(); 
                watchController = new AbortController();
                await activeDevice.watchAdvertisements({ signal: watchController.signal });
            } catch (e) {
                console.log("Scanner restart note: ", e.message);
            }
        }

        setInterval(() => {
            if (activeDevice && (Date.now() - lastSignalTime > 5000)) {
                startScanning();
                lastSignalTime = Date.now(); 
            }
        }, 3000);

        function updateUI(dist) {
            states.forEach(state => state.classList.remove('active'));
            if (dist > 5.0) { states[0].classList.add('active'); } 
            else if (dist > 3.0) { states[1].classList.add('active'); } 
            else if (dist > 1.5) { states[2].classList.add('active'); } 
            else if (dist > 0.5) { states[3].classList.add('active'); } 
            else { states[4].classList.add('active'); }
        }
    </script>
</body>
</html>
