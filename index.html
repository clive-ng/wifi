<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Explorer & Light Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background: #121212; color: white; 
            text-align: center; display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0;
        }
        .container { width: 100%; max-width: 400px; }
        
        /* Beacon Distance Styles */
        .beacon-card {
            background: #1e1e1e; padding: 20px; border-radius: 15px; margin-bottom: 20px;
            border: 1px solid #333;
        }
        #scanBtn { 
            padding: 12px; width: 100%; font-size: 16px; cursor: pointer; 
            background: #3498db; color: white; border: none; border-radius: 8px;
            margin-bottom: 15px; font-weight: bold;
        }
        .distance-display { font-size: 1.2rem; margin: 10px 0; font-weight: bold; color: #f1c40f; }

        .proximity-state { 
            padding: 15px; border-radius: 8px; font-size: 1rem; margin-top: 10px;
            display: none; font-weight: bold;
        }
        .active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #state1 { background: #7f8c8d; } #state2 { background: #3498db; } 
        #state3 { background: #2ecc71; } #state4 { background: #e67e22; } #state5 { background: #e74c3c; }

        /* MQTT Control Styles */
        .control-card { background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        #status { font-size: 0.8rem; color: #888; margin-bottom: 15px; }
        .status-online { color: #2ecc71 !important; font-weight: bold; }
        
        button.ctrl { 
            padding: 18px; margin: 8px 0; width: 100%; border-radius: 10px; 
            border: none; font-weight: bold; cursor: pointer; font-size: 1rem;
        }
        button:disabled { opacity: 0.2; cursor: not-allowed; }
        .on { background: #2ecc71; color: white; } 
        .off { background: #e74c3c; color: white; } 
        .blink { background: #f1c40f; color: #121212; }
    </style>
</head>
<body>

<div class="container">
    <h1>Museum Explorer</h1>

    <div class="beacon-card">
        <button id="scanBtn">CONNECT TO BEACON</button>
        <div class="distance-display">Distance: <span id="distanceLabel">--</span>m</div>
        
        <div id="state1" class="proximity-state active">1. Out of range</div>
        <div id="state2" class="proximity-state">2. Signal detected</div>
        <div id="state3" class="proximity-state">3. Getting closer</div>
        <div id="state4" class="proximity-state">4. Very close</div>
        <div id="state5" class="proximity-state">5. Artifact reached!</div>
    </div>

    <div class="control-card">
        <div id="status">Connecting to Cloud Control...</div>
        <button class="ctrl on" onclick="send('1')" disabled>TURN ON</button>
        <button class="ctrl off" onclick="send('0')" disabled>TURN OFF</button>
        <button class="ctrl blink" onclick="send('2')" disabled>SLOW BLINK</button>
        <button class="ctrl blink" onclick="send('3')" disabled>FAST STROBE</button>
    </div>
</div>

<script>
    // --- 1. MQTT SETTINGS (4G Cloud) ---
    const mqtt_topic = "exhibit/clive/lights"; 
    var mqtt_client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "clive_combined_" + Math.random().toString(16).substr(2, 8));

    mqtt_client.connect({
        useSSL: true,
        onSuccess: () => {
            document.getElementById("status").innerHTML = "● CLOUD CONTROL READY (4G)";
            document.getElementById("status").className = "status-online";
            document.querySelectorAll('.ctrl').forEach(btn => btn.disabled = false);
        },
        onFailure: () => { document.getElementById("status").innerHTML = "Cloud Offline. Retrying..."; }
    });

    function send(msg) {
        if (mqtt_client.isConnected()) {
            var message = new Paho.MQTT.Message(msg);
            message.destinationName = mqtt_topic;
            mqtt_client.send(message);
        }
    }

    // --- 2. BEACON SETTINGS (Bluetooth) ---
    const scanBtn = document.getElementById('scanBtn');
    const distanceLabel = document.getElementById('distanceLabel');
    const proximityStates = [
        document.getElementById('state1'), document.getElementById('state2'),
        document.getElementById('state3'), document.getElementById('state4'),
        document.getElementById('state5')
    ];

    let activeDevice = null;
    let watchController = new AbortController();
    let lastSignalTime = Date.now();
    let smoothedRssi = null;
    const alpha = 0.7;

    scanBtn.addEventListener('click', async () => {
        try {
            scanBtn.innerText = "Searching...";
            activeDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true, 
                optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
            });

            scanBtn.innerText = `Beacon: ${activeDevice.name || "Connected"}`;

            activeDevice.addEventListener('advertisementreceived', (event) => {
                lastSignalTime = Date.now();
                let currentRssi = event.rssi;
                if (smoothedRssi === null) smoothedRssi = currentRssi;
                else smoothedRssi = (alpha * currentRssi) + ((1 - alpha) * smoothedRssi);
                
                let txPower = -59; 
                let ratio = (txPower - smoothedRssi) / (10 * 2.0);
                let distance = Math.pow(10, ratio).toFixed(2);
                
                distanceLabel.innerText = distance;
                updateProximityUI(distance);
            });

            startBluetoothScanning();
        } catch (error) {
            scanBtn.innerText = "CONNECT TO BEACON";
            alert("Bluetooth Scan Failed.");
        }
    });

    async function startBluetoothScanning() {
        if (!activeDevice) return;
        try {
            watchController.abort();
            watchController = new AbortController();
            await activeDevice.watchAdvertisements({ signal: watchController.signal });
        } catch (e) { console.log("Restarting scanner..."); }
    }

    function updateProximityUI(dist) {
        proximityStates.forEach(s => s.classList.remove('active'));
        if (dist > 5.0) proximityStates[0].classList.add('active');
        else if (dist > 3.0) proximityStates[1].classList.add('active');
        else if (dist > 1.5) proximityStates[2].classList.add('active');
        else if (dist > 0.5) proximityStates[3].classList.add('active');
        else proximityStates[4].classList.add('active');
    }

    // Keep Bluetooth active
    setInterval(() => {
        if (activeDevice && (Date.now() - lastSignalTime > 5000)) {
            startBluetoothScanning();
            lastSignalTime = Date.now();
        }
    }, 3000);
</script>

</body>
</html>
