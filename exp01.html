<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Explorer & Light Control</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        /* Base Setup */
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: -apple-system, sans-serif; 
            color: white; 
        }
        
        /* The Shader Background */
        canvas { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: -1; /* Puts it behind the UI */
        }

        /* The UI Overlay */
        #ui-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px;
            background: rgba(18, 18, 18, 0.85); /* Semi-transparent background */
            padding: 20px; border-radius: 15px; border: 1px solid #333;
            text-align: center; backdrop-filter: blur(5px);
            z-index: 10;
        }

        h1 { font-size: 1.2rem; margin-top: 0; margin-bottom: 20px; }
        
        /* Beacon Button */
        #scanBtn { 
            padding: 12px; width: 100%; font-size: 16px; cursor: pointer; 
            background: #3498db; color: white; border: none; border-radius: 8px;
            margin-bottom: 10px; font-weight: bold; transition: 0.2s;
        }
        #scanBtn:active { transform: scale(0.95); }
        .distance-display { font-size: 1.1rem; margin-bottom: 20px; color: #aaa; }
        #distanceLabel { font-size: 1.4rem; color: #fff; font-weight: bold; }

        hr { border: 0.5px solid #444; margin: 20px 0; }

        /* MQTT Light Controls */
        #status { font-size: 0.8rem; color: #888; margin-bottom: 15px; }
        .status-online { color: #2ecc71 !important; font-weight: bold; }
        
        button.ctrl { 
            padding: 15px; margin: 5px 0; width: 100%; border-radius: 8px; 
            border: none; font-weight: bold; cursor: pointer; font-size: 1rem;
            transition: 0.2s;
        }
        button.ctrl:active { transform: scale(0.95); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .on { background: #2ecc71; color: white; } 
        .off { background: #e74c3c; color: white; } 
        .blink { background: #f1c40f; color: #121212; }
    </style>
</head>
<body>

<div id="ui-container">
    <h1>Museum Explorer</h1>

    <button id="scanBtn">CONNECT TO BEACON</button>
    <div class="distance-display">Distance: <span id="distanceLabel">--</span>m</div>
    
    <hr>

    <div id="status">Connecting to Cloud...</div>
    <button class="ctrl on" onclick="send('1')" disabled>TURN ON</button>
    <button class="ctrl off" onclick="send('0')" disabled>TURN OFF</button>
    <button class="ctrl blink" onclick="send('2')" disabled>SLOW BLINK</button>
    <button class="ctrl blink" onclick="send('3')" disabled>FAST STROBE</button>
</div>

<script>
    // ==========================================
    // 1. SHADER BACKGROUND (Your Exact Code)
    // ==========================================
    const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;
    
    const fragmentShader = `
        uniform float t;
        uniform vec2 r;
        uniform float dist; // Distance from Beacon

        // HSV helper function (Required for WebGL)
        vec3 hsv(float h, float s, float v) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(vec3(h) + K.xyz) * 6.0 - K.www);
            return v * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), s);
        }

        void main() {
            vec2 FC = gl_FragCoord.xy;
            vec4 o = vec4(0.0);
            
            // --- YOUR COMPACT CODE ---
            // Variables initialized to prevent WebGL compilation errors on mobile
            float i=0.,s=0.,R=0.,e=0.; 
            vec3 q=vec3(0.),p=vec3(0.);
            
            // Centered camera ray
            vec3 d=vec3((FC.xy-.5*r)/r.y,1.0);
            
            for(q.yz--;i++<50.;){
                e+=i/5e3;
                if(i>35.) d/=-d;
                
                // Color and Brightness react to 'dist'
                o.rgb+=hsv(dist*0.15, e-.4, (e/17.)/(dist+0.2));
                
                s=1.;
                p=q+=d*e*R*.18;
                p=vec3(log(R=length(p))-t*.2, -p.z/R, p.yz-1.*p.xx-t*.2);
                
                for(e=--p.y;s<5e2;s+=s) e+=cos(dot(cos(p*s),sin(p.zxy*s)))/s*.8;
            }
            // ---------------------------
            
            o.a = 1.0;
            gl_FragColor = o;
        }
    `;

    // Setup Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const uniforms = {
        t: { value: 0 },
        r: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        dist: { value: 5.0 } // Starts at 5 meters (Blue/Dim)
    };

    const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    function animate(time) {
        uniforms.t.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.r.value.set(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 2. BLUETOOTH BEACON LOGIC
    // ==========================================
    const scanBtn = document.getElementById('scanBtn');
    const distanceLabel = document.getElementById('distanceLabel');
    let activeDevice = null;

    scanBtn.addEventListener('click', async () => {
        try {
            scanBtn.innerText = "Searching...";
            activeDevice = await navigator.bluetooth.requestDevice({ 
                acceptAllDevices: true, 
                optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] 
            });

            scanBtn.innerText = "Tracking: " + (activeDevice.name || "Artifact");
            scanBtn.style.background = "#2ecc71";

            activeDevice.addEventListener('advertisementreceived', (event) => {
                let rssi = event.rssi;
                let txPower = -59; 
                let ratio = (txPower - rssi) / (10 * 2.0);
                let distance = Math.pow(10, ratio).toFixed(2);
                
                // Update UI Text
                distanceLabel.innerText = distance;
                
                // SEND DISTANCE TO SHADER
                uniforms.dist.value = parseFloat(distance); 
            });

            await activeDevice.watchAdvertisements();
        } catch (error) {
            scanBtn.innerText = "CONNECT TO BEACON";
            alert("Bluetooth Scan Failed.");
        }
    });

    // ==========================================
    // 3. MQTT 4G CLOUD LOGIC
    // ==========================================
    const mqtt_topic = "exhibit/clive/lights"; 
    var mqtt_client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "clive_web_" + Math.random().toString(16).substr(2, 8));

    mqtt_client.connect({
        useSSL: true, // Required for GitHub Pages
        onSuccess: () => {
            document.getElementById("status").innerHTML = "● CLOUD CONTROL READY (4G)";
            document.getElementById("status").className = "status-online";
            // Enable the buttons
            document.querySelectorAll('.ctrl').forEach(btn => btn.disabled = false);
        },
        onFailure: () => { 
            document.getElementById("status").innerHTML = "Cloud Offline. Retrying..."; 
        }
    });

    function send(msg) {
        if (mqtt_client.isConnected()) {
            var message = new Paho.MQTT.Message(msg);
            message.destinationName = mqtt_topic;
            mqtt_client.send(message);
        }
    }
</script>

</body>
</html>
