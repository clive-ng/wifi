<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Shader Explorer</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui { 
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(20, 20, 20, 0.8); padding: 20px; 
            border-radius: 15px; text-align: center; border: 1px solid #444;
            min-width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        h2 { margin: 0 0 15px 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        
        button { 
            padding: 12px 20px; cursor: pointer; border-radius: 8px; border: none; 
            font-weight: bold; background: #3498db; color: white; width: 100%;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        .distance-display { margin-top: 15px; font-size: 1.1rem; color: #aaa; }
        #distLabel { font-size: 1.5rem; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <h2>Artifact Radar</h2>
    <button id="scanBtn">CONNECT TO BEACON</button>
    <div class="distance-display">Distance: <span id="distLabel">--</span> m</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// --- SHADER SETUP ---
const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;

const fragmentShader = `
    uniform float t;        // Time
    uniform vec2 r;         // Resolution
    uniform float dist;     // Physical distance from Beacon
    
    void mainImage(out vec4 o, in vec2 FC) {
        float s, R, e = 0.0;
        
        // 1. CENTERING: Calculate ray direction from the exact center of the screen
        vec3 d = normalize(vec3((FC.xy - 0.5 * r) / r.y, 1.0)); 
        vec3 q = vec3(0.0, -1.0, -1.0), p;
        
        // 2. PROXIMITY MATH: Convert distance (0m - 5m) into a 0.0 to 1.0 multiplier
        // If dist > 5m, prox = 0.0 (Far). If dist = 0m, prox = 1.0 (Close).
        float prox = clamp(1.0 - (dist / 5.0), 0.0, 1.0);
        
        // Speed slightly increases as you get closer
        float time_speed = t * (0.2 + prox * 0.4);
        
        o = vec4(0.0);
        
        for(float i = 0.0; i < 50.0; i++) {
            e += i / 5000.0;
            if(i > 35.0) d /= -d; // Fractal fold
            
            // 3. COLOR SHIFT: Mix from Blue (0.6) to Red (1.0) based on proximity
            float hue = mix(0.6, 1.0, prox);
            
            // 4. BRIGHTNESS: Multiply the light intensity drastically as prox approaches 1.0
            float brightness = (e / 17.0) * (0.5 + prox * 3.5);
            
            // HSV to RGB Conversion
            vec3 hsv = vec3(hue, 0.8, brightness);
            vec3 rgb = clamp(abs(mod(hsv.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            o.rgb += rgb * hsv.z;
            
            s = 1.0;
            p = q += d * e * R * 0.18;
            R = length(p);
            
            // Geometry math
            p = vec3(log(R) - time_speed, -p.z / R, p.y - p.x - time_speed);
            
            // Detail loop
            for(int j = 0; j < 9; j++) {
                e += cos(dot(cos(p * s), sin(p.zxy * s))) / s * 0.8;
                s += s;
            }
        }
        o.a = 1.0;
    }

    void main() {
        mainImage(gl_FragColor, gl_FragCoord.xy);
    }
`;

// --- THREE.JS INITIALIZATION ---
const scene = new THREE.Scene();
const camera = new THREE.Camera();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// We start the distance at 10.0 so it loads in the "Blue/Far" state
const uniforms = {
    t: { value: 0 },
    r: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    dist: { value: 10.0 } 
};

const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
scene.add(mesh);

function animate(time) {
    uniforms.t.value = time * 0.001;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate();

// --- RESIZE HANDLER (Keeps it centered) ---
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.r.value.set(window.innerWidth, window.innerHeight);
});

// --- BLUETOOTH DISTANCE LOGIC ---
const scanBtn = document.getElementById('scanBtn');
const distLabel = document.getElementById('distLabel');

scanBtn.addEventListener('click', async () => {
    try {
        scanBtn.innerText = "Searching...";
        const device = await navigator.bluetooth.requestDevice({ 
            acceptAllDevices: true,
            optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
        });
        
        scanBtn.innerText = "Tracking: " + (device.name || "Beacon");
        scanBtn.style.background = "#2ecc71";
        
        device.addEventListener('advertisementreceived', (event) => {
            let rssi = event.rssi;
            let txPower = -59; // Standard 1m RSSI
            
            // Calculate distance
            let ratio = (txPower - rssi) / (10 * 2.0);
            let distance = Math.pow(10, ratio).toFixed(2);
            
            // Update the text on screen
            distLabel.innerText = distance;
            
            // Send the distance directly into the Shader math!
            uniforms.dist.value = parseFloat(distance); 
        });

        // Start watching for Bluetooth pulses
        await device.watchAdvertisements();
    } catch (e) { 
        console.error(e); 
        scanBtn.innerText = "CONNECT TO BEACON";
    }
});
</script>
</body>
</html>
